name: Weekly Freight Rate Report

# Monday 00:00 UTC = 08:00 SGT
# Committing the DB back to the repo means each subsequent run inherits
# the full rate history without needing a separate persistence layer.

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable verbose Python logging"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write   # needed for the DB commit-back step

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  TZ: "Asia/Singapore"

jobs:
  weekly-report:
    name: Scrape → Analyse → Report → Commit DB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout — use the built-in GITHUB_TOKEN so the commit-back push
      #    works without a PAT.  fetch-depth: 0 ensures git log is available.
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 2. Python 3.11
      # -----------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: freight-tracker/requirements.txt

      # -----------------------------------------------------------------------
      # 3. Dependencies
      # -----------------------------------------------------------------------
      - name: Install Python dependencies
        working-directory: freight-tracker
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        working-directory: freight-tracker
        run: playwright install chromium --with-deps

      # -----------------------------------------------------------------------
      # 4. Ensure output directories exist
      # -----------------------------------------------------------------------
      - name: Create runtime directories
        working-directory: freight-tracker
        run: mkdir -p data reports/output

      # -----------------------------------------------------------------------
      # 5. Run the full pipeline
      # -----------------------------------------------------------------------
      - name: Run full pipeline
        working-directory: freight-tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONVERBOSE: ${{ github.event.inputs.debug == 'true' && '1' || '' }}
        run: python main.py --run-now

      # -----------------------------------------------------------------------
      # 6. Build the GitHub Pages static site from the generated reports
      # -----------------------------------------------------------------------
      - name: Build GitHub Pages site
        working-directory: freight-tracker
        run: python -m pages.builder

      # -----------------------------------------------------------------------
      # 7. Commit the SQLite DB, reports, and Pages site back to the repo
      # -----------------------------------------------------------------------
      - name: Commit freight_rates.db, reports, and Pages site
        working-directory: freight-tracker
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage DB, reports, and the generated Pages site
          git add data/freight.db || true
          git add reports/output/  || true
          git add ../docs/         || true

          # Only commit when there is something new
          if git diff --cached --quiet; then
            echo "Nothing to commit — no changes."
          else
            RUN_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore: update freight DB, report, and Pages site [${RUN_DATE}] [skip ci]"
            git push origin HEAD
          fi

      # -----------------------------------------------------------------------
      # 7. Upload artifacts for audit trail (90-day retention)
      # -----------------------------------------------------------------------
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: |
            freight-tracker/reports/output/
            freight-tracker/scraper.log
          retention-days: 90

      - name: Upload database snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freight-db-${{ github.run_id }}
          path: freight-tracker/data/freight.db
          retention-days: 90
