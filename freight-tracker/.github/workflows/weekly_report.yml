name: Weekly Freight Rate Report

on:
  schedule:
    # Every Sunday at 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: false
        default: "weekly"
        type: choice
        options:
          - weekly
          - report-only
          - scrape-only

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  weekly-report:
    name: Scrape → Analyse → Report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: freight-tracker/requirements.txt

      - name: Install Python dependencies
        working-directory: freight-tracker
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        working-directory: freight-tracker
        run: playwright install chromium --with-deps

      - name: Create data directory
        working-directory: freight-tracker
        run: mkdir -p data reports/output

      - name: Run freight tracker
        working-directory: freight-tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || 'weekly' }}"
          python main.py --mode "$MODE"

      - name: Upload weekly report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: |
            freight-tracker/reports/output/
            freight-tracker/scraper.log
          retention-days: 90

      - name: Upload SQLite database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freight-db-${{ github.run_id }}
          path: freight-tracker/data/freight.db
          retention-days: 90
