name: Intraday Freight Rate Check

on:
  schedule:
    # Mon–Fri at 06:00, 10:00, 14:00, 18:00 UTC
    - cron: "0 6  * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "0 14 * * 1-5"
    - cron: "0 18 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: false
        default: "intraday"
        type: choice
        options:
          - intraday
          - scrape-only

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  intraday-check:
    name: Intraday Scrape & Alert
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: freight-tracker/requirements.txt

      - name: Install Python dependencies
        working-directory: freight-tracker
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        working-directory: freight-tracker
        run: playwright install chromium --with-deps

      - name: Create data directory
        working-directory: freight-tracker
        run: mkdir -p data reports/output

      - name: Run intraday check
        working-directory: freight-tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'intraday' }}"
          python main.py --mode "$MODE"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-logs-${{ github.run_id }}
          path: freight-tracker/scraper.log
          retention-days: 14
