# ============================================================
# Freight Rate Tracker — Configuration
# ============================================================

# --- Scraper toggles ---
scrapers:
  drewry: true
  freightos: true
  scfi: true

# --- Analysis parameters ---
analysis:
  spike_threshold_pct: 10.0   # % weekly change that triggers a spike signal
  short_ma_weeks: 4
  long_ma_weeks: 12
  trend_window_weeks: 4
  history_weeks: 24            # weeks of history used in signal computation

# --- Alert thresholds (USD per FEU) ---
# Add route-specific hard limits here. When the current rate exceeds
# the threshold an intraday alert is fired.
alerts:
  spike_pct: 10.0              # also used in intraday checks
  rate_thresholds:
    # Example entries — customise for your monitored routes:
    # "China/East Asia → North America West Coast": 6000
    # "Shanghai → Europe": 4000

# --- Telegram notifications ---
# Prefer setting TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID as environment
# variables (e.g. GitHub Actions secrets). Values here are fallbacks.
telegram:
  bot_token: ""     # override with env var TELEGRAM_BOT_TOKEN
  chat_id: ""       # override with env var TELEGRAM_CHAT_ID

# --- Database ---
database:
  path: "data/freight.db"

# --- Logging ---
logging:
  level: "INFO"
  file: "scraper.log"
  max_bytes: 5242880    # 5 MB
  backup_count: 3
