# ============================================================
# Freight Rate Tracker — Configuration
# ============================================================

# ---------------------------------------------------------------------------
# Scraper toggles
# ---------------------------------------------------------------------------
scrapers:
  drewry: true
  freightos: true
  scfi: true
  # Input cost scrapers — run separately via --input-costs
  bunker: true
  crude: true
  # News sentiment — runs inside --run-now (requires ANTHROPIC_API_KEY)
  news_sentiment: true

# ---------------------------------------------------------------------------
# Alert thresholds
# ---------------------------------------------------------------------------
alert_thresholds:
  wow_pct: 10        # WoW % move that triggers an intraday Telegram alert
  stress_pct: 40     # Route % above 12-week avg that flags STRESS
  divergence_pct: 15 # FBX vs WCI spread that flags DIVERGENCE

# ---------------------------------------------------------------------------
# Routes monitored by the intraday check.
# Leave empty ([]) to monitor every route currently in the DB.
# ---------------------------------------------------------------------------
routes_of_interest:
  # Must match the route labels stored in the DB by the scrapers.
  # SCFI uses "Shanghai → <destination>"; Freightos uses broad region labels.
  # The intraday check does a case-insensitive substring match, so partial
  # names work (e.g. "US West Coast" matches "Shanghai → US West Coast").
  - "Shanghai → US West Coast"    # SCFI / Drewry WCI Shanghai→LA corridor
  - "Shanghai → Europe"           # SCFI Europe composite
  - "Shanghai → Mediterranean"    # SCFI Mediterranean (Genoa corridor)
  - "Europe → North America East Coast"  # Freightos FBX05 (NY↔Rotterdam)

# ---------------------------------------------------------------------------
# Timezone used for display / log labels (does not affect cron schedule,
# which always runs in UTC).
# ---------------------------------------------------------------------------
timezone: "Asia/Singapore"

# ---------------------------------------------------------------------------
# Analysis parameters
# ---------------------------------------------------------------------------
analysis:
  short_ma_weeks: 4
  long_ma_weeks: 12
  trend_window_weeks: 4
  history_weeks: 12

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
database:
  path: "data/freight.db"

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"
  file: "scraper.log"
  max_bytes: 5242880   # 5 MB
  backup_count: 3
